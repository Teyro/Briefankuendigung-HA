name: Briefankündigung
version: "1.0.0"
slug: briefankuendigung
description: Holt die Briefankündigungen der Deutschen Post aus dem Postfach (IMAP) – Vorschau in Home Assistant und für das iPhone-Widget
url: https://github.com/Teyro/Briefankuendigung-HA
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:email-newsletter
panel_title: Briefe
homeassistant_api: true
map:
  - media:rw
options:
  imap_server: imap.gmx.net
  imap_port: 993
  benutzer: ""
  passwort: ""
  absender: ankuendigung@brief.deutschepost.de
  ordner: INBOX
  abrufzeiten: "02:00,05:00"
  tage: 14
schema:
  imap_server: str
  imap_port: port
  benutzer: str?
  passwort: password?
  absender: str
  ordner: str
  abrufzeiten: match(^\d{1,2}:\d{2}([ ,;]+\d{1,2}:\d{2})*$)
  tage: int(1,60)
