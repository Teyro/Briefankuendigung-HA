<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Briefankündigung</title>
<style>
:root { color-scheme: light dark; --page: #f6f4ee; --karte: #fff; --text: #1d1b16; --leise: #6e6a60; --linie: #1d1b1614; --gelb: #ffcc00; --warn: #b3261e; }
@media (prefers-color-scheme: dark) { :root { --page: #15140f; --karte: #22201a; --text: #f4f1e8; --leise: #a8a395; --linie: #ffffff14; --warn: #ff8a80; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
.seite { max-width: 1100px; margin: 0 auto; padding: 18px 16px 40px; }
.kopf { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.logo { width: 46px; height: 46px; border-radius: 14px; background: var(--gelb); display: grid; place-items: center; font-size: 24px; }
h1 { font-size: 22px; margin: 0; } .klein { color: var(--leise); font-size: 13px; }
button { margin-left: auto; border: 0; border-radius: 12px; padding: 10px 16px; font: 600 14px inherit; font-family: inherit; background: var(--gelb); color: #1d1b16; cursor: pointer; }
button:disabled { opacity: .5; }
.fehler { background: #b3261e1a; color: var(--warn); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
.raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.brief { background: var(--karte); border-radius: 18px; overflow: hidden; border: 1px solid var(--linie); }
.brief img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: contain; background: #fff; border-bottom: 1px solid var(--linie); }
.brief .ohne { aspect-ratio: 16 / 10; display: grid; place-items: center; color: var(--leise); font-size: 40px; background: var(--linie); }
.brief .i { padding: 10px 14px 14px; } .brief b { display: block; font-size: 16px; }
.leer { text-align: center; color: var(--leise); padding: 50px 10px; }
</style></head><body><div class="seite">
<div class="kopf"><div class="logo">📬</div><div><h1>Briefankündigung</h1><div class="klein" id="stand"></div></div><button id="abrufen">Jetzt abrufen</button></div>
<div class="fehler" id="fehler" hidden></div>
<div class="raster" id="raster"></div>
</div>
<script>
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
const datum = (ms) => new Date(ms).toLocaleString("de-DE", { weekday: "short", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
async function laden() {
  const s = await (await fetch("api/status")).json();
  document.getElementById("stand").textContent = (s.stand ? "Stand " + datum(s.stand) : "Noch nicht abgerufen") + " · Abruf täglich um " + s.zeiten.join(" und ") + " Uhr";
  const f = document.getElementById("fehler");
  f.hidden = !s.fehler && s.eingerichtet; f.textContent = s.fehler || (!s.eingerichtet ? "Bitte in der Konfiguration des Add-ons E-Mail-Adresse und Passwort eintragen." : "");
  const r = document.getElementById("raster");
  r.replaceChildren();
  if (!s.briefe.length) { r.append(el("div", "leer", "Keine Briefe angekündigt.")); return; }
  for (const b of s.briefe) {
    const k = el("div", "brief");
    if (b.bild) { const i = el("img"); i.src = "bild/" + b.id; i.alt = "Brief"; i.loading = "lazy"; k.append(i); } else k.append(el("div", "ohne", "✉️"));
    const t = el("div", "i");
    t.append(el("b", "", b.absender || "Absender unbekannt"), el("div", "klein", datum(b.datum)));
    k.append(t); r.append(k);
  }
}
document.getElementById("abrufen").onclick = async (e) => {
  e.target.disabled = true; e.target.textContent = "Wird abgerufen …";
  try { await fetch("api/abrufen", { method: "POST", headers: { "X-Brief": "1" } }); } finally { e.target.disabled = false; e.target.textContent = "Jetzt abrufen"; laden(); }
};
laden();
</script></body></html>
